# OriginsPaper configuration

# Whether players are forced to pick an origin on first join (cannot close the GUI until chosen)
force-selection-on-join: true
# Delay in ticks before the selection GUI opens on join
join-gui-delay-ticks: 20
# Verbose logging: prints per-power apply/remove and skill activity to the console
debug: false

performance:
  # When > 0 (and debug is on), logs a dispatch summary (onTick calls/skips, entity scans,
  # claim checks) every N seconds. The same numbers are always available via /origin debug perf.
  log-tick-summary-seconds: 0

# Soft integrations with third-party plugins. Every hook is optional: the plugin boots and runs
# normally with none of them installed. Setting enabled: false skips a hook even when the plugin
# is present. Changes apply on /origin reload.
integrations:
  axgraves:
    # Strips the origins' protected wings out of AxGraves death graves (anti-duplication).
    enabled: true
  griefprevention:
    # Claim-aware filtering for area/hostile abilities (Pounce, Leap, Dragon's Breath,
    # Echolocation, Alpha's Howl, Pollinator, Feeding Rush, Blood Sense, Scavenger's Luck,
    # Rear Kick and Stink Spray). Filtering is per target: the ability still fires, it just skips
    # protected targets. Protection fails closed on lookup errors.
    enabled: true
    # Area damage cannot hit claim-protected targets (hostile mobs are always fair game).
    protect-claims-from-origin-aoe: true
    # Non-damage effects (Glowing reveal, buffs) cannot reach players inside claims the caster
    # is not trusted in.
    block-hostile-origin-effects-in-other-claims: true
    # Allow effects/damage inside claims the caster owns or has build trust in.
    allow-effects-in-own-claims: true
    # Allow effects/damage inside admin claims.
    allow-effects-in-admin-claims: false
  simple-voice-chat:
    # Detection + tuning values only for now; no power uses voice chat yet. The plugin's
    # registered name is "voicechat".
    enabled: true
    wolf-howl-radius: 32
    bat-echolocation-radius: 24
    skunk-spray-muffle-seconds: 5
    stealth-reduces-voice-range: true
  placeholderapi:
    # Detection only — placeholder expansion planned.
    enabled: true
  worldguard:
    # Detection only — region-flag checks planned.
    enabled: true
  luckperms:
    # Detection only — permission-driven features planned.
    enabled: true

# Reserved for future balance tuning (damage caps, cooldown scaling). Empty for now.
balance: {}

# Per-origin kill switches and balance values. Changes apply on /origin reload. Missing keys keep
# the defaults shown here, so older server configs remain compatible after an update.
origins:
  red_panda:
    enabled: true
    max-health-penalty-hearts: 1
    fluffy-tail-cooldown-seconds: 25
    # Duration of the area Regeneration granted by Fluffy Tail (self + nearby players).
    fluffy-tail-regen-seconds: 5
    climber-enabled: true
  shark:
    enabled: true
    feeding-rush-cooldown-seconds: 30
    feeding-rush-damage: 4
    blood-sense-radius: 16
    blood-sense-health-percent: 60
    dry-skin-warning-seconds: 180
    dry-skin-penalty-seconds: 300
    predator-bite-extra-damage: 2
    # Seconds the Feeding Rush bite keeps the prey bleeding (1 damage/s; 0 disables).
    feeding-rush-bleed-seconds: 4
  raccoon:
    enabled: true
    scurry-cooldown-seconds: 20
    scurry-speed-seconds: 3
    scurry-invisibility-seconds: 1
    scavenger-luck-chance: 0.07
    scavenger-luck-enabled: true
    # Chance of a villager purchase coming out free (ingredients refunded; 30s internal cooldown).
    thief-chance: 0.10
    max-health-penalty-hearts: 1
  equine:
    enabled: true
    gallop-stage-1-seconds: 3
    gallop-stage-2-seconds: 6
    rear-kick-cooldown-seconds: 25
    rear-kick-radius: 3
    rear-kick-damage: 2
  skunk:
    enabled: true
    stink-spray-cooldown-seconds: 35
    stink-spray-radius: 4
    stink-spray-player-slowness-seconds: 4
    stink-spray-player-weakness-seconds: 4
    stink-spray-player-nausea-seconds: 2
    stink-spray-mob-slowness-seconds: 6
    stink-spray-mob-weakness-seconds: 6
    stink-spray-mob-nausea-seconds: 5
    # Kept as an explicit balance contract: Stink Spray is control/escape, never damage.
    stink-spray-damage: 0
    max-health-penalty-hearts: 1
